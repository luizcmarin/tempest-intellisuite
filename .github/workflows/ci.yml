name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Bundle
        run: bun run build:bundle

      - name: Package (.vsix)
        run: bunx @vscode/vsce package --no-dependencies -o tempest-intellisuite.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: tempest-intellisuite-vsix
          path: tempest-intellisuite.vsix
